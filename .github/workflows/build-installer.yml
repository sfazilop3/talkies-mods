name: Build the Talkies Mods installer app

# The small app people sideload once. It finds the newest release made by build-talkies.yml in THIS repository.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["installer/**", ".github/workflows/build-installer.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then echo "Add the four signing secrets first (see README.md, step 2)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mods.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/mods.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > installer/release.properties

      - name: Build
        working-directory: installer
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PmodsRepo="$GITHUB_REPOSITORY"
          cp app/build/outputs/apk/release/app-release.apk ../TalkiesMods.apk

      - name: Publish (a pre-release, so it never counts as the newest Talkies)
        run: |
          set -euo pipefail
          gh release view installer >/dev/null 2>&1 || gh release create installer --prerelease --title "Talkies Mods installer" --notes "The app to sideload once: it installs the newest Talkies with the mods."
          gh release upload installer TalkiesMods.apk --clobber
